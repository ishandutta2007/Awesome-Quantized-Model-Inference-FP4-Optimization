<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-18px) translateX(10px); opacity: 0.7; }
    }
    @keyframes floatParticleSlow {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(-15px); opacity: 0.8; }
    }
    @keyframes chipShimmer {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.9; }
    }
    .bg-pulse {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 600px 180px;
    }
    .flow-path {
      stroke-dasharray: 20, 10;
      animation: flowLine 14s linear infinite;
    }
    .p1 { animation: floatParticle 5s ease-in-out infinite; }
    .p2 { animation: floatParticleSlow 7s ease-in-out infinite 1s; }
    .p3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .p4 { animation: floatParticleSlow 8s ease-in-out infinite 3s; }
    .p5 { animation: floatParticle 6.5s ease-in-out infinite 1.5s; }
    .chip-border { animation: chipShimmer 4s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1196" height="356" x="2" y="2" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Background Animated Glow Blobs (strictly behind text & UI) -->
  <circle cx="200" cy="180" r="170" fill="url(#glowGrad)" class="bg-pulse"/>
  <circle cx="1000" cy="180" r="190" fill="url(#glowGrad)" class="bg-pulse" style="animation-delay: -3.5s;"/>

  <!-- Background Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.2">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="250" y1="0" x2="250" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="550" y1="0" x2="550" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="850" y1="0" x2="850" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Flow Circuit Lines (background aesthetic) -->
  <path d="M 50 180 Q 250 80 500 180 T 950 180 T 1150 120" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.4" class="flow-path"/>
  <path d="M 50 240 Q 350 320 650 220 T 1150 240" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.3" class="flow-path" style="animation-direction: reverse; animation-duration: 18s;"/>

  <!-- Floating Particles / Micro-Quantized Bits -->
  <circle cx="160" cy="90" r="3" fill="#38bdf8" class="p1"/>
  <circle cx="280" cy="270" r="2.5" fill="#818cf8" class="p2"/>
  <circle cx="450" cy="70" r="2" fill="#c084fc" class="p3"/>
  <circle cx="750" cy="290" r="3.5" fill="#34d399" class="p4"/>
  <circle cx="920" cy="80" r="2.5" fill="#38bdf8" class="p5"/>
  <circle cx="1060" cy="280" r="3" fill="#f43f5e" class="p1"/>
  <circle cx="1120" cy="160" r="2" fill="#fbbf24" class="p3"/>

  <!-- Header Category Badge -->
  <g transform="translate(600, 52)" text-anchor="middle">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1" class="chip-border"/>
    <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">
      ⚡ NEXT-GEN MODEL ACCELERATION
    </text>
  </g>

  <!-- Main Banner Title (Foreground, crisp & prominent) -->
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="#f8fafc" letter-spacing="-0.5" filter="url(#softShadow)">
    Awesome Quantized Model Inference
  </text>
  <text x="600" y="174" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#accentGrad)" letter-spacing="-0.5">
    &amp; FP4 Optimization
  </text>

  <!-- Subtitle (Foreground, clear reading) -->
  <text x="600" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.3">
    Curated Hub for NVFP4 • MXFP4 • AWQ • GPTQ • Marlin Kernels • vLLM • High-Throughput Serving
  </text>

  <!-- Architecture Badges / Metric Pills Row -->
  <g transform="translate(600, 275)" text-anchor="middle">
    <!-- Pill 1: NVFP4 / MXFP4 -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
        🚀 NVFP4 &amp; MXFP4
      </text>
    </g>

    <!-- Pill 2: 4x VRAM Reduction -->
    <g transform="translate(-180, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
        📉 4x VRAM Savings
      </text>
    </g>

    <!-- Pill 3: Fused CUDA Kernels -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
        ⚙️ Marlin / W4A16
      </text>
    </g>

    <!-- Pill 4: Production vLLM / SGLang -->
    <g transform="translate(180, 0)">
      <rect x="-80" y="-18" width="160" height="36" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
        🔥 vLLM &amp; SGLang
      </text>
    </g>

    <!-- Pill 5: Blackwell & Hopper Ready -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-18" width="170" height="36" rx="10" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.6"/>
      <text y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e2e8f0">
        🦾 Blackwell &amp; Hopper
      </text>
    </g>
  </g>

  <!-- Bottom Accent Strip -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#accentGrad)"/>
</svg>
